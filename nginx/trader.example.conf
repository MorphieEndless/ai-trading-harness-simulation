# ==========================================================
# trader.example.com —— AI Trading Harness 面板
# Cloudflare 橙云代理 + Origin CA 通配证书
# 反代后端：127.0.0.1:18080（trader-brain 容器）
# ==========================================================

# 1. HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name trader.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# 2. HTTPS 反代
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trader.example.com;

    server_tokens off;

    ssl_certificate     /etc/ssl/certs/example.com.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 4m;

    # 第一道闸：边缘就要求 Basic Auth（应用层还有第二道，同一套凭证、
    # 同一个 realm，所以浏览器只会弹一次框）
    auth_basic "AI Trading Harness";
    auth_basic_user_file /etc/nginx/.htpasswd-halluwithcrypto;

    # 抵御暴力破解
    limit_req zone=hallu burst=12 nodelay;

    # ---------------------------------------------------------------- 公开只读页
    #
    # 2026-09-27 起对外开放：不带凭证也能看日志。**下面这两块是这份配置里
    # 唯一 auth_basic off 的地方**，而且它们必须和 brain/trader/web.py 的
    # PUBLIC_ROUTES 是同一个集合（多一个就是洞，少一个游客就打不开）。
    # test_public.py 有一条断言直接解析这份文件、跟那份白名单对账。
    #
    # 谁说了算：**应用层**。nginx 放过去的请求，web.py 的中间件还会再判一次，
    # 判不过照样 401。所以这里万一多开了，最坏结果是"游客看到 401"，
    # 而不是"配置漏出去" —— 闸门有两个，方向永远是往严的那边走。
    #
    # 关于限流（记在案，别重踩）：服务器挂在 Cloudflare 橙云后面，
    # nginx 看到的 $remote_addr 是**CF 边缘的 IP**，不是访客的。
    # 所以 `limit_req zone=hallu`（server 级，公开页也继承）实际是
    # "每个 CF 边缘共用一个桶"，人一多会先撞到它 —— 而不是撞到访客的额度。
    # 现在没改它，因为真正的并发闸门在应用层（PUBLIC_MAX_STREAMS，全局 40 路）
    # 且公开页只有两个轮询端点，正常流量远够不着。等到真的被 CF 边缘限流
    # （日志里 503 变多）时，正确的修法是在 nginx.conf 的 http{} 里加：
    #
    #   map $http_cf_connecting_ip $hallu_client {
    #       default $http_cf_connecting_ip;
    #       ""      $remote_addr;          # 直连回源（绕过 CF）时兜底
    #   }
    #   limit_req_zone  $hallu_client zone=hallu_pub:10m rate=5r/s;
    #   limit_conn_zone $hallu_client zone=hallu_conn:10m;
    #
    # 然后下面这两块换成 `limit_req zone=hallu_pub burst=30 nodelay;`
    # 和 `limit_conn hallu_conn 8;`。那两步要改 http 层，得重跑 setup.sh。
    location = /live {
        auth_basic off;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /api/public/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 这里也有 SSE（/api/public/events/stream），所以 buffering 必须关 ——
        # 反代攒着不发的话，日志会一块一块地跳出来。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # 比私有那条（3600s）短：公开流是**没有人盯着的常驻连接**，
        # 应用层每 15 秒发一次 keepalive，所以 120 秒足够判定"这个连接已经死了"
        # 并及时回收。私有那条不动的理由是它只有你自己在用，掉线重连即可。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 实时日志流：必须彻底关掉缓冲，否则日志会被攒住看不到
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
